name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Types (next typegen + tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, Chromium)
        run: npm run test:e2e

      # Mobile preset (Moto G Power, simulated slow 4G). Three runs, median per metric,
      # so one noisy run cannot fail the build on its own.
      - name: Lighthouse (mobile)
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          mkdir -p lighthouse
          for run in 1 2 3; do
            npx --yes lighthouse@13 http://127.0.0.1:3000/ \
              --quiet \
              --form-factor=mobile \
              --only-categories=performance \
              --output=json \
              --output-path="lighthouse/run-$run.json" \
              --chrome-flags="--headless=new --no-sandbox"
          done
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync } from 'node:fs';

          const LIMITS = [
            { id: 'largest-contentful-paint', label: 'LCP', max: 2500, unit: 'ms' },
            { id: 'cumulative-layout-shift', label: 'CLS', max: 0.1, unit: '' },
            { id: 'total-blocking-time', label: 'TBT', max: 300, unit: 'ms' },
          ];
          const reports = readdirSync('lighthouse')
            .filter((f) => f.endsWith('.json'))
            .map((f) => JSON.parse(readFileSync(`lighthouse/${f}`, 'utf8')));
          const median = (values) => values.sort((a, b) => a - b)[Math.floor(values.length / 2)];

          let failed = false;
          for (const { id, label, max, unit } of LIMITS) {
            const values = reports.map((r) => r.audits[id]?.numericValue).filter((v) => typeof v === 'number');
            if (values.length === 0) {
              console.log(`✖ ${label}: no value in any run`);
              failed = true;
              continue;
            }
            const value = median(values);
            const shown = unit === 'ms' ? `${Math.round(value)} ms` : value.toFixed(3);
            const ok = value <= max;
            if (!ok) failed = true;
            console.log(`${ok ? '✔' : '✖'} ${label} ${shown} (median of ${values.length}; limit ${max}${unit ? ` ${unit}` : ''})`);
          }
          const scores = reports.map((r) => Math.round((r.categories.performance?.score ?? 0) * 100));
          console.log(`Performance scores: ${scores.join(', ')}`);
          process.exit(failed ? 1 : 0);
          EOF

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            lighthouse/
            next-start.log
          if-no-files-found: ignore
          retention-days: 14
