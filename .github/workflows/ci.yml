name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Types (next typegen + tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Keyless: fails when src/data or the site copy changed without `npm run ai:corpus`.
      - name: AI corpus freshness
        run: npm run ai:corpus -- --check

      - name: Retrieval recall floor (keyless)
        run: npm run ai:recall

      - name: Build
        run: npm run build

      # No Gemini key pattern in the client build, prerendered pages or public/, no
      # SDK in client chunks, and next.config's env block holds only its four keys.
      - name: AI secret scan
        run: npm run ai:scan

      - name: Bundle budget
        run: npm run budget

      # The e2e shards and Lighthouse serve this build, the one the scan and the budget
      # just checked, rather than each rebuilding (the prebuild step refetches live data).
      # Every file under .next counts as hidden to upload-artifact, hence include-hidden-files.
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          include-hidden-files: true
          path: |
            .next/
            !.next/cache/
          if-no-files-found: error
          retention-days: 1

  # 28 projects (7 viewports x 2 themes x 2 motion) make over 11,000 tests: about an
  # hour at the 2 workers a 4-vCPU runner gets (estimated from timed runs on software
  # GL), so the suite runs in 8 shards. A shard is a contiguous run of tests, so the
  # last two hold the 1440 projects, where most specs run; the heaviest was estimated
  # at about 15 minutes.
  e2e:
    name: End-to-end (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `next start` with AI_FAKE_MODEL=1 and no key, so the
      # AI specs drive the real routes without calling Gemini. --global-timeout (32 min)
      # stops the run before the step timeout (35) kills it, so a slow shard still writes
      # its blob report, and the step timeout sits under the job's, so the upload runs.
      - name: End-to-end tests (Playwright, Chromium)
        timeout-minutes: 35
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=list,blob --global-timeout=1920000

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  # Merges the shards' blob reports, failed shards included, into one HTML report.
  e2e-report:
    name: End-to-end report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Mobile preset (Moto G Power, simulated slow 4G). Three runs, median per metric,
      # so one noisy run cannot fail the build on its own. Budgets live in
      # src/lib/lighthouseBudget.ts (LCP 2.5 s, CLS 0.1, TBT 300 ms). LIGHTHOUSE_ENFORCE
      # lists the metrics whose miss fails the job; a miss on the others is a warning
      # annotation plus a row in the step summary. LCP and TBT are report-only until the
      # home page is within budget: replays of this step against the 2026-09-25 build had
      # median LCP 6.1-7.0 s and TBT 1.2-2.8 s. Add them back here once they pass, and
      # update the baseline in src/lib/lighthouseBudget.test.ts to the new medians.
      - name: Lighthouse (mobile)
        timeout-minutes: 12
        env:
          LIGHTHOUSE_ENFORCE: CLS
        run: |
          npx next start -p 3000 > next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          mkdir -p lighthouse
          for run in 1 2 3; do
            npx --yes lighthouse@13 http://127.0.0.1:3000/ \
              --quiet \
              --form-factor=mobile \
              --only-categories=performance \
              --output=json \
              --output-path="lighthouse/run-$run.json" \
              --chrome-flags="--headless=new --no-sandbox" \
              || echo "::warning title=Lighthouse::Run $run exited non-zero; the medians use the runs that wrote a report."
          done
          node scripts/check-lighthouse.mjs --dir lighthouse

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: |
            lighthouse/
            next-start.log
          if-no-files-found: ignore
          retention-days: 14
